<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- favicon: брусника berry — band palette (pink #f3a9bd → crimson) -->
  <defs>
    <radialGradient id="berry" cx="36%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffd6e0"/>
      <stop offset="38%" stop-color="#f3a9bd"/>
      <stop offset="100%" stop-color="#b22746"/>
    </radialGradient>
  </defs>
  <!-- stem -->
  <path d="M16.2 14 C 16 10.5 16.4 8 18 6.2" fill="none" stroke="#5d8a55" stroke-width="1.4" stroke-linecap="round"/>
  <!-- leaf -->
  <path d="M18 6.4 C 21.2 3.6 26 4.4 26 4.4 C 26 4.4 25.2 9.6 21.4 10.8 C 18.7 11.6 17 9.2 18 6.4 Z" fill="#598f4f"/>
  <path d="M19 6.8 C 21.5 5.6 24.4 5.6 24.4 5.6" fill="none" stroke="#7cb072" stroke-width="0.7" stroke-linecap="round"/>
  <!-- berries -->
  <circle cx="12.4" cy="20.4" r="6.6" fill="url(#berry)"/>
  <circle cx="20.6" cy="18.8" r="5.8" fill="url(#berry)"/>
  <!-- calyx specks -->
  <circle cx="12.4" cy="20.4" r="1.05" fill="#6f152e" opacity="0.6"/>
  <circle cx="20.6" cy="18.8" r="0.95" fill="#6f152e" opacity="0.6"/>
  <!-- highlights -->
  <circle cx="9.9" cy="17.6" r="1.7" fill="#ffffff" opacity="0.5"/>
  <circle cx="18.4" cy="16.4" r="1.3" fill="#ffffff" opacity="0.45"/>
</svg>
